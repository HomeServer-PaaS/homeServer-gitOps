apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: calico-network
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/HomeServer-PaaS/homeServer-gitOps.git
    targetRevision: main
    path: infrastructure/calico
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - ServerSideApply=true
